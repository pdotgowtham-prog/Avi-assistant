name: AVI memory consistency, retrieval and extraction checks

on:
  push:
    branches:
      - phase-4a-memory-consistency
      - phase-4b-backend-memory-retrieval
      - phase-4c-automatic-memory-intelligence
      - phase-4d-memory-quality-controls
  pull_request:
    branches:
      - main
      - phase-4a-memory-consistency
      - phase-4b-backend-memory-retrieval
      - phase-4c-automatic-memory-intelligence
      - phase-4d-memory-quality-controls

permissions:
  contents: read

jobs:
  memory-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Phase 4A memory consistency invariants
        run: node scripts/check-avi-memory.mjs
      - name: Verify Phase 4B backend retrieval
        run: node scripts/check-avi-memory-retrieval.mjs
      - name: Verify Phase 4C automatic extraction
        run: node scripts/check-avi-memory-extraction.mjs
      - name: Verify Phase 4D near-duplicate detection
        run: node scripts/check-avi-memory-deduplication.mjs
      - name: Verify Phase 4D conflict candidate detection
        run: node scripts/check-avi-memory-conflicts.mjs
